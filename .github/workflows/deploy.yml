# Builds the app and deploys it to GitHub Pages.
name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress
# and latest queued. However, do NOT cancel in-progress runs as we want to allow these
# production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The English model is ~3MB from a CDN; the wasm is copied from node_modules.
      - name: Cache the OCR model
        uses: actions/cache@v4
        with:
          path: public/tesseract/eng.traineddata.gz
          key: tesseract-eng-${{ hashFiles('scripts/setup-ocr.mjs') }}

      - name: Vendor the OCR engine
        run: npm run setup:ocr

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # After setup:ocr, so the real-tesseract test runs rather than skipping itself.
      - name: Test
        run: npm test

      - name: Build
        env:
          # A project page serves from /<repo>/, not the root. Deriving the prefix from
          # the repository name means a rename or a fork needs no edit here.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The built site, not the repository: index.html at the repo root points at
          # /src/main.tsx, which only Vite can serve.
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
